{% extends "base.html" %}

{% block title %}Student Area — LMS Portal{% endblock %}

{% block extra_css %}
<style>
  .test-card {
    max-width: 600px;
    margin: 2rem auto;
    background: rgba(27, 30, 48, 0.85);
    border: 1px solid rgba(99, 102, 241, 0.3);
    border-radius: 16px;
    padding: 2.5rem;
    text-align: center;
    backdrop-filter: blur(16px);
  }
  .test-icon {
    font-size: 3rem;
    color: #818cf8;
    margin-bottom: 1rem;
  }
</style>
{% endblock %}

{% block content %}
<div class="test-card" id="student-only-page">
  <div class="test-icon"><i class="fa-solid fa-graduation-cap"></i></div>
  <h1 style="color:var(--text-primary); margin-bottom:0.5rem;">Student Only Page</h1>
  <p style="color:var(--text-secondary); margin-bottom:1.5rem;">
    Access granted. You are logged in as a <strong>Student</strong> ({{ user.username }}).
  </p>
  <a href="{% url 'users:student_dashboard' %}" class="nav-btn" style="display:inline-block;">Go to Student Dashboard</a>
</div>
{% endblock %}
