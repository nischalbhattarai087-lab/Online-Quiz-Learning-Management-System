{% extends "base.html" %}

{% block title %}Password Reset Complete — LMS Portal{% endblock %}

{% block extra_css %}
<style>
  .auth-wrapper {
    min-height: calc(100vh - 140px);
    display: flex; align-items: center; justify-content: center;
    padding: 3rem 1rem;
  }

  .auth-card {
    width: 100%; max-width: 480px;
    background: rgba(27, 30, 48, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px; padding: 2.75rem 2.5rem;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 8px 48px rgba(0, 0, 0, 0.5);
    text-align: center;
    animation: slideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .auth-icon-success {
    display: inline-flex; align-items: center; justify-content: center;
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3);
    font-size: 1.8rem; color: #34d399; margin-bottom: 1.25rem;
  }

  .auth-title {
    font-family: 'Outfit', sans-serif; font-size: 1.65rem; font-weight: 700;
    color: var(--text-primary); margin-bottom: 0.75rem;
  }

  .auth-desc {
    color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6;
    margin-bottom: 2rem;
  }

  .btn-primary-link {
    display: inline-block; padding: 0.85rem 2rem; border-radius: 10px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    color: #fff; text-decoration: none; font-weight: 600; font-size: 1rem;
    transition: var(--transition-smooth);
    box-shadow: 0 4px 18px rgba(99, 102, 241, 0.35);
  }

  .btn-primary-link:hover {
    transform: translateY(-2px); box-shadow: 0 8px 28px rgba(99, 102, 241, 0.5);
  }
</style>
{% endblock %}


{% block content %}
<div class="auth-wrapper" id="password-reset-complete-page">
  <div class="auth-card" role="main">

    <div class="auth-icon-success" aria-hidden="true">
      <i class="fa-solid fa-shield-check"></i>
    </div>

    <h1 class="auth-title">Password Reset Complete</h1>

    <p class="auth-desc">
      Your password has been set successfully. You can now log in with your new password.
    </p>

    <a href="{% url 'users:login' %}" class="btn-primary-link" id="btn-login-now">
      <i class="fa-solid fa-right-to-bracket" style="margin-right:0.4rem;"></i>
      Sign In Now
    </a>

  </div>
</div>
{% endblock %}
