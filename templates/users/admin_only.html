{% extends "base.html" %}

{% block title %}Admin Area — LMS Portal{% endblock %}

{% block extra_css %}
<style>
  .test-card {
    max-width: 600px;
    margin: 2rem auto;
    background: rgba(27, 30, 48, 0.85);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 16px;
    padding: 2.5rem;
    text-align: center;
    backdrop-filter: blur(16px);
  }
  .test-icon {
    font-size: 3rem;
    color: #f87171;
    margin-bottom: 1rem;
  }
</style>
{% endblock %}

{% block content %}
<div class="test-card" id="admin-only-page">
  <div class="test-icon"><i class="fa-solid fa-user-shield"></i></div>
  <h1 style="color:var(--text-primary); margin-bottom:0.5rem;">Admin Only Page</h1>
  <p style="color:var(--text-secondary); margin-bottom:1.5rem;">
    Access granted. You are logged in as an <strong>Admin</strong> ({{ user.username }}).
  </p>
  <a href="/admin/" class="nav-btn" style="display:inline-block;">Go to Django Admin</a>
</div>
{% endblock %}
