{% extends "base.html" %}

{% block title %}Teacher Area — LMS Portal{% endblock %}

{% block extra_css %}
<style>
  .test-card {
    max-width: 600px;
    margin: 2rem auto;
    background: rgba(27, 30, 48, 0.85);
    border: 1px solid rgba(168, 85, 247, 0.3);
    border-radius: 16px;
    padding: 2.5rem;
    text-align: center;
    backdrop-filter: blur(16px);
  }
  .test-icon {
    font-size: 3rem;
    color: #c084fc;
    margin-bottom: 1rem;
  }
</style>
{% endblock %}

{% block content %}
<div class="test-card" id="teacher-only-page">
  <div class="test-icon"><i class="fa-solid fa-chalkboard-user"></i></div>
  <h1 style="color:var(--text-primary); margin-bottom:0.5rem;">Teacher Only Page</h1>
  <p style="color:var(--text-secondary); margin-bottom:1.5rem;">
    Access granted. You are logged in as a <strong>Teacher</strong> ({{ user.username }}).
  </p>
  <a href="{% url 'users:teacher_dashboard' %}" class="nav-btn" style="display:inline-block;">Go to Teacher Dashboard</a>
</div>
{% endblock %}
